<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGradient" x1="20" y1="65" x2="80" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="100" height="100" rx="22" fill="#020617"/>

  <!-- Globe : cercle + méridiens -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9"/>
  <ellipse cx="50" cy="50" rx="12" ry="30" fill="none" stroke="#38bdf8" stroke-width="1.6" opacity="0.4"/>
  <line x1="20" y1="50" x2="80" y2="50" stroke="#38bdf8" stroke-width="1.6" opacity="0.4"/>

  <!-- Vague à l'intérieur du globe -->
  <path d="M25 55
           Q 37.5 43, 50 51
           Q 62.5 59, 75 45"
        fill="none"
        stroke="url(#waveGradient)"
        stroke-width="6"
        stroke-linecap="round"/>

  <!-- Masque pour que la vague reste bien dans le cercle -->
  <clipPath id="globeClip">
    <circle cx="50" cy="50" r="30"/>
  </clipPath>
</svg>